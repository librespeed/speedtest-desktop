name: Build & Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read version and check it against the tag
        id: resolve
        run: |
          VERSION=$(sed -nE 's/^version = "(.*)"/\1/p' build.gradle.kts)
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $VERSION in build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 keeps the AppImage glibc baseline low. GitHub retires
          # these runners in April 2027 - to keep the baseline afterwards,
          # build inside an older container on a newer runner.
          - runner: ubuntu-22.04
            arch: x86_64
            deb-arch: amd64
          - runner: ubuntu-22.04-arm
            arch: aarch64
            deb-arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build deb and distributable
        run: ./gradlew packageReleaseDeb createReleaseDistributable
      - name: Build AppImage
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          APPDIR=build/LibreSpeed.AppDir
          mkdir -p "$APPDIR"
          cp -r build/compose/binaries/main-release/app/LibreSpeed/. "$APPDIR"/
          cp src/main/resources/files/icon_app.png "$APPDIR/librespeed.png"
          cat > "$APPDIR/librespeed.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=LibreSpeed
          Exec=LibreSpeed
          Icon=librespeed
          Categories=Network;
          EOF
          ln -s bin/LibreSpeed "$APPDIR/AppRun"
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x appimagetool
          ARCH=${{ matrix.arch }} ./appimagetool --appimage-extract-and-run "$APPDIR" "librespeed_${VERSION}_${{ matrix.arch }}.AppImage"
      - name: Collect deb
        run: cp build/compose/binaries/main-release/deb/*.deb "librespeed_${{ needs.version.outputs.version }}_${{ matrix.deb-arch }}.deb"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            librespeed_*.AppImage
            librespeed_*.deb

  macos:
    name: macOS ${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build dmg
        run: ./gradlew packageReleaseDmg
      - name: Collect dmg
        run: cp build/compose/binaries/main-release/dmg/*.dmg "librespeed_${{ needs.version.outputs.version }}_${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: librespeed_*.dmg

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x86_64
            jdk-distribution: temurin
            suffix: installer_win
          - runner: windows-11-arm
            arch: aarch64
            # Temurin does not ship Windows ARM64 builds of JDK 21
            jdk-distribution: microsoft
            suffix: installer_win_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.jdk-distribution }}
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build msi
        run: ./gradlew packageReleaseMsi
      - name: Collect msi
        shell: bash
        run: cp build/compose/binaries/main-release/msi/*.msi "librespeed_${{ needs.version.outputs.version }}_${{ matrix.suffix }}.msi"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: librespeed_*.msi

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ linux, macos, windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/*
